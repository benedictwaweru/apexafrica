services:
  vault-data-init:
    image: busybox:latest
    user: root
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - vault_agent_sink:/vault/agent-sink
    command: ["sh", "-c", "chown -R 100:100 /vault/data /vault/logs /vault/agent-sink"]

  vault-server:
    image: hashicorp/vault:2.0.3
    container_name: vault-server
    volumes:
      - ./infra/vault-server/config:/vault/config:ro
      - ./infra/vault-server/policies:/vault/policies:ro
      - ./certs/vault-server:/vault/certs:ro
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    command: ["server"]
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_CACERT: ${VAULT_CACERT}
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      vault-data-init:
        condition: service_completed_successfully
    ports:
      - "8200:8200"

  vault-agent:
    image: hashicorp/vault:2.0.3
    container_name: vault-agent
    restart: unless-stopped
    depends_on:
      vault-server:
        condition: service_healthy
    volumes:
      - ./infra/vault-agent/config:/vault/config:ro
      - ./certs/ca:/vault/certs:ro
      - ./infra/vault-agent/templates:/vault/templates:ro
      - vault_agent_sink:/vault/agent-sink
    command: ["agent", "-config=/vault/config/agent.hcl"]

  postgres:
    image: postgres:18.3-bookworm
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/postgresql/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 30s
      retries: 5

  pg-admin:
    image: dpage/pgadmin4:9.15.0
    container_name: pg-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-database:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.6.2-alpine
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass
      ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY}
    volumes:
      - ./infra/redis/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  keycloak-database:
    image: postgres:18.3-bookworm
    container_name: keycloak-database
    environment:
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_NAME}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: apexafrica/keycloak:latest
    container_name: keycloak
    command: start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_HTTPS_CERTIFICATE_FILE: ${KC_HTTPS_CERTIFICATE_FILE}
      KC_HTTPS_CERTIFICATE_KEY_FILE: ${KC_HTTPS_CERTIFICATE_KEY_FILE}
      KC_HTTPS_PORT: ${KC_HTTPS_PORT}

      KC_DB_URL: jdbc:postgresql://keycloak-database:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
    ports:
      - "${KC_HTTPS_PORT}:${KC_HTTPS_PORT}"
    volumes:
      - ./certs/keycloak:/opt/keycloak/conf/tls:ro
    depends_on:
      keycloak-database:
        condition: service_healthy

  etcd:
    image: quay.io/coreos/etcd:v3.5.31
    container_name: apisix-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-token=apisix-etcd-token
      - --initial-cluster-state=new
      - --log-level=info
      - --logger=zap
      - --log-outputs=stderr
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/etcdctl",
          "--endpoints=http://127.0.0.1:2379",
          "endpoint",
          "health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  apisix:
    image: apache/apisix:3.17.0-ubuntu
    container_name: apisix
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./infra/apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - apisix_logs:/usr/local/apisix/logs
    ports:
      - "9080:9080" # HTTP gateway  ← your API traffic goes here
      - "9443:9443" # HTTPS gateway
      - "9180:9180" # Admin API
      - "9091:9091" # Prometheus metrics  (GET /apisix/prometheus/metrics)
      - "9092:9092" # Control API
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9080/apisix/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  keycloak_postgres_data:
  etcd_data:
  apisix_logs:
  vault_data:
  vault_logs:
  vault_agent_sink:

networks:
  apexafrica:
